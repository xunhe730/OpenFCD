[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openfcd"
version = "0.0.1"
description = "Fast Checkerboard Demodulation desktop app for free-surface reconstruction"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-image>=0.22",
    "h5py>=3.10",
    "pydantic>=2.6",
    "ruamel.yaml>=0.18",
    "typer>=0.12",
    "loky>=3.4",
    "matplotlib>=3.8",
    "threadpoolctl>=3.0",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.6",
    "pyqtgraph>=0.13",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
openfcd = "openfcd.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["openfcd"]

[tool.hatch.build.targets.sdist]
include = [
    "/openfcd",
    "/tests",
    "/scripts",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
